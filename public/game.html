<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Church Shooter – 게임</title>
<link rel="stylesheet" href="css/style.css">
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; width:100%; height:100%; }
  #game-canvas { display:block; position:fixed; inset:0; width:100%; height:100%; touch-action:none; }

  /* Wave HUD */
  #wave-hud {
    display:none; position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.65); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.18); border-radius:20px;
    padding:6px 20px; font-size:15px; font-weight:700; color:#fff;
    z-index:8; white-space:nowrap; pointer-events:none;
  }

  /* Team HUD */
  #team-hud {
    display:none; position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.65); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.18); border-radius:20px;
    padding:6px 20px; font-size:15px; font-weight:700; color:#fff;
    z-index:8; pointer-events:none;
  }

  /* HP bar */
  #hud-hp {
    position:fixed; top:14px; left:14px; z-index:9;
    display:flex; align-items:center; gap:8px;
    background:rgba(0,0,0,0.55); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.12); border-radius:14px;
    padding:7px 14px;
  }
  #hud-hp .label { font-size:12px; color:rgba(255,255,255,0.5); font-weight:700; }
  #hp-bar { width:90px; height:8px; background:rgba(255,255,255,0.12); border-radius:4px; overflow:hidden; }
  #hp-fill { height:100%; width:100%; background:#10B981; border-radius:4px; transition:width 0.15s,background 0.3s; }
  #hp-num { font-size:14px; font-weight:700; color:#fff; min-width:28px; }

  /* Ammo HUD */
  #hud-ammo {
    position:fixed; top:14px; right:14px; z-index:9;
    background:rgba(0,0,0,0.55); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.12); border-radius:14px;
    padding:7px 14px; text-align:right;
  }
  #ammo-weapon-name { font-size:11px; color:rgba(255,255,255,0.45); font-weight:600; }
  #ammo-cur { font-size:22px; font-weight:900; color:#fff; }
  #ammo-max { font-size:13px; color:rgba(255,255,255,0.4); }

  /* Kill feed */
  #kill-feed {
    position:fixed; top:58px; right:14px; z-index:15;
    display:flex; flex-direction:column; gap:4px; align-items:flex-end;
    pointer-events:none;
  }
  .kf-item {
    background:rgba(0,0,0,0.72); backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,0.1); border-radius:8px;
    padding:4px 10px; font-size:12px; color:#fff;
    animation:fadeIn 0.2s ease;
  }

  /* Hit flash */
  #hit-flash {
    position:fixed; inset:0; z-index:20; pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 50%,rgba(255,40,40,0.55) 100%);
    opacity:0; transition:opacity 0.12s;
  }

  /* Reload button */
  #reload-btn {
    position:fixed; bottom:28px; right:24px; z-index:12;
    width:58px; height:58px; border-radius:50%;
    background:rgba(30,30,50,0.82); backdrop-filter:blur(6px);
    border:2px solid rgba(255,255,255,0.25); color:#fff;
    font-size:12px; font-weight:700; cursor:pointer;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  #reload-btn:active { background:rgba(99,102,241,0.6); }
  #reload-btn.reloading { border-color:#F59E0B; color:#F59E0B; }

  /* Game over overlay */
  #game-over-overlay {
    display:none; position:fixed; inset:0; z-index:40;
    background:rgba(0,0,0,0.78); backdrop-filter:blur(10px);
    flex-direction:column; align-items:center; justify-content:center; gap:16px;
  }

  /* Game result overlay */
  #game-result-overlay {
    display:none; position:fixed; inset:0; z-index:45;
    background:rgba(0,0,0,0.88); backdrop-filter:blur(14px);
    flex-direction:column; align-items:center; justify-content:center;
    padding:32px; gap:16px; overflow-y:auto;
  }
  .result-title { font-size:36px; font-weight:900; color:#10B981; }
  .result-table { border-collapse:collapse; min-width:260px; }
  .result-table th, .result-table td {
    padding:8px 16px; text-align:left; font-size:14px;
    border-bottom:1px solid rgba(255,255,255,0.1);
  }
  .result-table th { color:rgba(255,255,255,0.5); font-size:12px; font-weight:600; }
  .result-table td { color:#fff; }

  /* Wave announce */
  #wave-announce {
    display:none; position:fixed; inset:0; z-index:30; pointer-events:none;
    flex-direction:column; align-items:center; justify-content:center; gap:10px;
  }
  #wave-announce-text {
    font-size:42px; font-weight:900; color:#fff;
    text-shadow:0 0 50px rgba(124,58,237,0.9),0 0 20px rgba(124,58,237,0.5);
    letter-spacing:2px; animation:wavePop 0.4s ease;
  }
  #wave-announce-sub { font-size:16px; color:rgba(255,255,255,0.7); }

  /* Loading overlay */
  #loading-overlay {
    position:fixed; inset:0; z-index:60;
    background:#0f0f1a; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
  }
  .loading-spinner {
    width:44px; height:44px; border:3px solid rgba(99,102,241,0.3);
    border-top-color:#6366F1; border-radius:50%;
    animation:spin 0.8s linear infinite;
  }

  @keyframes spin     { to { transform:rotate(360deg); } }
  @keyframes fadeIn   { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:none; } }
  @keyframes wavePop  { from { transform:scale(0.6); opacity:0; } to { transform:scale(1); opacity:1; } }
</style>
</head>
<body>

<!-- 3D world (Three.js) -->
<canvas id="three-canvas" style="position:fixed;inset:0;width:100%;height:100%;display:block;background:#0a0e1a;touch-action:none"></canvas>
<!-- 2D HUD overlay (minimap, joystick, crosshair, kill-feed live here) -->
<canvas id="game-canvas" style="position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;background:transparent"></canvas>
<!-- Touch listener catcher (covers screen, doesn't paint) -->
<div id="touch-catcher" style="position:fixed;inset:0;z-index:1;touch-action:none"></div>

<!-- Loading screen (shown until game connects) -->
<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div style="font-size:16px;color:rgba(255,255,255,0.6)">게임 연결 중...</div>
</div>

<!-- HP HUD -->
<div id="hud-hp">
  <span class="label">HP</span>
  <div id="hp-bar"><div id="hp-fill"></div></div>
  <span id="hp-num">100</span>
</div>

<!-- Ammo HUD -->
<div id="hud-ammo">
  <div id="ammo-weapon-name">권총</div>
  <div><span id="ammo-cur">12</span><span id="ammo-max"> / 12</span></div>
</div>

<!-- Wave HUD -->
<div id="wave-hud"><span id="wave-label">웨이브 1 / 5</span></div>

<!-- FFA HUD -->
<div id="ffa-hud" style="display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.18);
  border-radius:20px;padding:6px 20px;font-size:14px;font-weight:700;color:#fff;z-index:8;pointer-events:none">
  🏆 내 킬: <span id="my-kills" style="color:#FBBF24">0</span> / 10
</div>

<!-- Team HUD -->
<div id="team-hud">
  <span style="color:#EF4444">🔴 <span id="red-count">0</span></span>
  <span style="color:rgba(255,255,255,0.35);margin:0 8px">/ 20</span>
  <span style="color:#3B82F6">🔵 <span id="blue-count">0</span></span>
</div>

<!-- Active power-up indicator -->
<div id="powerup-active" style="display:none;position:fixed;top:62px;left:14px;z-index:9;
  background:linear-gradient(135deg,rgba(124,58,237,0.85),rgba(236,72,153,0.85));
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.25);border-radius:14px;
  padding:6px 14px;color:#fff;font-size:13px;font-weight:700;
  box-shadow:0 0 18px rgba(236,72,153,0.5)">
  <span id="pw-icon">⚡</span> <span id="pw-name">부스트</span> <span id="pw-timer" style="opacity:0.7">5s</span>
</div>

<!-- Killstreak banner -->
<div id="killstreak-banner" style="display:none;position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);z-index:30;pointer-events:none;text-align:center;
  animation:streakPop 0.6s ease">
  <div id="ks-streak" style="font-size:54px;font-weight:900;color:#FBBF24;
    text-shadow:0 0 30px rgba(251,191,36,0.9),0 4px 8px rgba(0,0,0,0.7)">3 KILLS</div>
  <div id="ks-reward" style="font-size:18px;color:#fff;font-weight:700;margin-top:4px;
    text-shadow:0 2px 8px rgba(0,0,0,0.8)">자동 회복!</div>
</div>
<style>
  @keyframes streakPop {
    0%   { transform:translate(-50%,-50%) scale(0.4); opacity:0; }
    40%  { transform:translate(-50%,-50%) scale(1.15); opacity:1; }
    100% { transform:translate(-50%,-50%) scale(1); opacity:1; }
  }
</style>

<!-- Kill feed -->
<div id="kill-feed"></div>

<!-- Hit flash -->
<div id="hit-flash"></div>

<!-- Reload button -->
<button id="reload-btn">재장전</button>

<!-- CHEAT button -->
<button id="cheat-btn" title="난사 모드 (4초)">🌀<br><span style="font-size:9px">치트</span></button>
<style>
  #cheat-btn {
    position:fixed; bottom:96px; right:24px; z-index:12;
    width:58px; height:58px; border-radius:50%;
    background:linear-gradient(135deg,#7C3AED,#EC4899);
    border:2px solid rgba(255,255,255,0.4); color:#fff;
    font-size:18px; font-weight:700; cursor:pointer; padding:0;
    box-shadow:0 0 24px rgba(236,72,153,0.55);
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    transition:transform 0.1s;
  }
  #cheat-btn:active { transform:scale(0.92); }
  #cheat-btn.cooldown {
    background:rgba(60,60,80,0.7); box-shadow:none;
    border-color:rgba(255,255,255,0.15); color:rgba(255,255,255,0.5);
  }
  #cheat-btn.active {
    animation:cheatPulse 0.3s ease-in-out infinite;
    box-shadow:0 0 40px rgba(236,72,153,0.9);
  }
  @keyframes cheatPulse {
    0%,100% { transform:scale(1); }
    50%     { transform:scale(1.12); }
  }
</style>

<!-- Touch controls hint -->
<div id="touch-hint" style="position:fixed;inset:0;z-index:35;pointer-events:none;
  display:none;flex-direction:row;align-items:flex-end;justify-content:space-between;
  padding:0 32px 110px;color:rgba(255,255,255,0.85);font-size:13px;font-weight:700;
  text-shadow:0 2px 6px rgba(0,0,0,0.9);">
  <div style="text-align:center">
    <div style="font-size:38px;margin-bottom:6px">👈</div>
    <div style="background:rgba(16,185,129,0.25);border:1px solid #6EE7B7;border-radius:10px;padding:6px 12px">
      왼쪽 손가락<br><span style="font-size:11px;opacity:0.8">이동</span>
    </div>
  </div>
  <div style="text-align:center">
    <div style="font-size:38px;margin-bottom:6px">👉</div>
    <div style="background:rgba(239,68,68,0.25);border:1px solid #FCA5A5;border-radius:10px;padding:6px 12px">
      오른쪽 손가락<br><span style="font-size:11px;opacity:0.8">조준 + 발사</span>
    </div>
  </div>
</div>

<!-- Wave announcement -->
<div id="wave-announce">
  <div id="wave-announce-text"></div>
  <div id="wave-announce-sub"></div>
</div>

<!-- Game Over overlay -->
<div id="game-over-overlay">
  <div style="font-size:64px">💀</div>
  <div style="font-size:28px;font-weight:900;color:#EF4444">사망</div>
  <div style="font-size:15px;color:rgba(255,255,255,0.6)">관전 중...</div>
  <button class="btn btn-secondary" onclick="location.href='lobby.html'"
    style="max-width:200px;margin-top:8px">로비로 돌아가기</button>
</div>

<!-- Game Result overlay -->
<div id="game-result-overlay">
  <div class="result-title" id="result-title">게임 종료!</div>
  <table class="result-table" id="result-table"></table>
  <div style="display:flex;gap:10px;margin-top:16px">
    <button class="btn btn-secondary" onclick="location.href='lobby.html'">로비</button>
    <button class="btn btn-primary" onclick="location.href='index.html'">처음부터</button>
  </div>
</div>

<div id="toast-container"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/game.js"></script>
</body>
</html>
